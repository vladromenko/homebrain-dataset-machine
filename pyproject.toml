[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homebrain-ai"
version = "0.1.0"
description = "Independent local robotics laboratory assistant"
requires-python = ">=3.12"
dependencies = ["fastapi==0.121.3", "uvicorn==0.38.0", "httpx==0.28.1", "python-multipart==0.0.20", "psutil==7.1.3", "faster-whisper==1.2.1", "piper-tts==1.3.0", "av==16.0.1", "huggingface-hub==0.36.0"]

[tool.setuptools.packages.find]
include = ["homebrain*"]

[tool.setuptools.package-data]
homebrain = ["static/*"]
